name: Sync PR to Feishu Bitable

on:
  pull_request:
    types: [opened, closed, reopened, edited, synchronize]

jobs:
  sync-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Get Feishu Access Token
        id: token
        run: |
          RESP=$(curl -s -X POST "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal" \
            -H "Content-Type: application/json" \
            -d '{"app_id":"'"${{ secrets.LARK_APP_ID }}"'","app_secret":"'"${{ secrets.LARK_APP_SECRET }}"'"}')
          echo "Response: $RESP"
          TOKEN=$(echo "$RESP" | jq -r '.tenant_access_token')
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "::error::Failed to get access token"
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Determine PR Status
        id: status
        run: |
          if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            echo "pr_status=Merged" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.action }}" = "closed" ]; then
            echo "pr_status=Closed" >> "$GITHUB_OUTPUT"
          else
            echo "pr_status=Open" >> "$GITHUB_OUTPUT"
          fi

      - name: Search Existing Record
        id: search
        run: |
          RESP=$(curl -s -X POST \
            "https://open.feishu.cn/open-apis/bitable/v1/apps/${{ secrets.BITABLE_APP_TOKEN }}/tables/${{ secrets.BITABLE_TABLE_ID }}/records/search" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d '{"filter":{"conjunction":"and","conditions":[{"field_name":"PR编号","operator":"is","value":["${{ github.event.pull_request.number }}"]}]}}')
          echo "Search response: $RESP"
          RECORD_ID=$(echo "$RESP" | jq -r '.data.items[0].record_id // empty')
          echo "record_id=$RECORD_ID" >> "$GITHUB_OUTPUT"

      - name: Build Fields JSON
        id: fields
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_REPO: ${{ github.event.repository.full_name }}
          PR_STATUS: ${{ steps.status.outputs.pr_status }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_CREATED: ${{ github.event.pull_request.created_at }}
          PR_UPDATED: ${{ github.event.pull_request.updated_at }}
        run: |
          CREATED_TS=$(date -d "$PR_CREATED" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$PR_CREATED" +%s 2>/dev/null || echo "")
          UPDATED_TS=$(date -d "$PR_UPDATED" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$PR_UPDATED" +%s 2>/dev/null || echo "")

          if [ -n "$CREATED_TS" ]; then
            CREATED_MS=$((CREATED_TS * 1000))
            UPDATED_MS=$((UPDATED_TS * 1000))
          fi

          FIELDS=$(jq -n \
            --arg title "$PR_TITLE" \
            --argjson number "$PR_NUMBER" \
            --arg author "$PR_AUTHOR" \
            --arg repo "$PR_REPO" \
            --arg status "$PR_STATUS" \
            --arg url "$PR_URL" \
            '{
              "PR标题": $title,
              "PR编号": $number,
              "作者": $author,
              "仓库": $repo,
              "状态": $status,
              "链接": $url
            }')

          if [ -n "$CREATED_TS" ]; then
            FIELDS=$(echo "$FIELDS" | jq \
              --argjson ct "$CREATED_MS" \
              --argjson ut "$UPDATED_MS" \
              '. + {"创建时间": $ct, "更新时间": $ut}')
          fi

          echo "Fields: $FIELDS"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "json<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$FIELDS" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Create or Update Record
        run: |
          RECORD_ID="${{ steps.search.outputs.record_id }}"
          FIELDS='${{ steps.fields.outputs.json }}'

          if [ -z "$RECORD_ID" ]; then
            echo "Creating new record..."
            RESP=$(curl -s -X POST \
              "https://open.feishu.cn/open-apis/bitable/v1/apps/${{ secrets.BITABLE_APP_TOKEN }}/tables/${{ secrets.BITABLE_TABLE_ID }}/records" \
              -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
              -H "Content-Type: application/json" \
              -d "{\"fields\": $FIELDS}")
            echo "✅ Create response: $RESP"
          else
            echo "Updating record: $RECORD_ID"
            RESP=$(curl -s -X PUT \
              "https://open.feishu.cn/open-apis/bitable/v1/apps/${{ secrets.BITABLE_APP_TOKEN }}/tables/${{ secrets.BITABLE_TABLE_ID }}/records/$RECORD_ID" \
              -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
              -H "Content-Type: application/json" \
              -d "{\"fields\": $FIELDS}")
            echo "✅ Update response: $RESP"
          fi
