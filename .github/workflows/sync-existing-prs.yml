name: Sync Existing PRs to Feishu Bitable

on:
  workflow_dispatch:
    inputs:
      state:
        description: 'PR state to sync'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - open
          - closed
          - merged
      limit:
        description: 'Max number of PRs to sync (0 = all)'
        required: false
        default: '0'
        type: string

jobs:
  sync-existing:
    runs-on: ubuntu-latest
    env:
      LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
      LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
      BITABLE_APP_TOKEN: ${{ secrets.BITABLE_APP_TOKEN }}
      BITABLE_TABLE_ID: ${{ secrets.BITABLE_TABLE_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install lark-cli
        run: npm install -g @larksuite/cli

      - name: Configure lark-cli
        run: |
          lark-cli config init --app-id "$LARK_APP_ID" --brand feishu --app-secret-stdin <<< "$LARK_APP_SECRET"
          lark-cli auth status

      - name: Fetch and sync PRs
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ inputs.state }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail

          # Determine gh pr list flags
          GH_ARGS=("--json" "number,title,state,isDraft,author,headRefName,baseRefName,headRefOid,url,body,createdAt,updatedAt,closedAt,mergedAt,mergedBy,commits,additions,deletions,changedFiles,labels,milestone,assignees,reviewRequests")

          if [ "$STATE" = "merged" ]; then
            GH_ARGS+=("--state" "closed" "--search" "is:merged")
          elif [ "$STATE" != "all" ]; then
            GH_ARGS+=("--state" "$STATE")
          else
            GH_ARGS+=("--state" "all")
          fi

          if [ "$LIMIT" != "0" ] && [ -n "$LIMIT" ]; then
            GH_ARGS+=("--limit" "$LIMIT")
          else
            GH_ARGS+=("--limit" "9999")
          fi

          echo "Fetching PRs with: gh pr list ${GH_ARGS[*]}"
          PRS=$(gh pr list "${GH_ARGS[@]}")
          TOTAL=$(echo "$PRS" | jq 'length')
          echo "Found $TOTAL PRs to sync"

          # Process each PR
          echo "$PRS" | jq -c '.[]' | while read -r PR; do
            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            echo "--- Processing PR #$PR_NUMBER ---"

            # Determine status
            PR_STATE=$(echo "$PR" | jq -r '.state')
            IS_DRAFT=$(echo "$PR" | jq -r '.isDraft')
            MERGED_AT=$(echo "$PR" | jq -r '.mergedAt // empty')

            if [ -n "$MERGED_AT" ]; then
              STATUS="Merged"
            elif [ "$PR_STATE" = "CLOSED" ]; then
              STATUS="Closed"
            elif [ "$IS_DRAFT" = "true" ]; then
              STATUS="Draft"
            else
              STATUS="Open"
            fi

            # Format dates
            fmt_date() {
              local raw="$1"
              [ -z "$raw" ] && echo "" && return
              date -d "$raw" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo "$raw"
            }

            CREATED_AT=$(fmt_date "$(echo "$PR" | jq -r '.createdAt // empty')")
            UPDATED_AT=$(fmt_date "$(echo "$PR" | jq -r '.updatedAt // empty')")
            CLOSED_AT=$(fmt_date "$(echo "$PR" | jq -r '.closedAt // empty')")
            MERGED_AT_FMT=$(fmt_date "$(echo "$PR" | jq -r '.mergedAt // empty')")

            # Extract fields
            TITLE=$(echo "$PR" | jq -r '.title // empty')
            AUTHOR=$(echo "$PR" | jq -r '.author.login // empty')
            BRANCH=$(echo "$PR" | jq -r '.headRefName // empty')
            BASE_BRANCH=$(echo "$PR" | jq -r '.baseRefName // empty')
            HEAD_SHA=$(echo "$PR" | jq -r '.headRefOid // empty')
            URL=$(echo "$PR" | jq -r '.url // empty')
            BODY=$(echo "$PR" | jq -r '.body // empty' | head -c 5000)
            COMMITS=$(echo "$PR" | jq -r '.commits.totalCount // 0')
            ADDITIONS=$(echo "$PR" | jq -r '.additions // 0')
            DELETIONS=$(echo "$PR" | jq -r '.deletions // 0')
            CHANGED_FILES=$(echo "$PR" | jq -r '.changedFiles // 0')
            LABELS=$(echo "$PR" | jq -r '[.labels[]?.name] | join(", ")')
            MILESTONE=$(echo "$PR" | jq -r '.milestone.title // empty')
            ASSIGNEES=$(echo "$PR" | jq -r '[.assignees[]?.login] | join(", ")')
            REVIEWERS=$(echo "$PR" | jq -r '[.reviewRequests[]?.login // .reviewRequests[]?.name] | join(", ")')
            MERGED_BY=$(echo "$PR" | jq -r '.mergedBy.login // empty')
            REPO="${{ github.repository }}"

            # Build fields JSON
            FIELDS=$(jq -n \
              --arg title "$TITLE" \
              --argjson number "$PR_NUMBER" \
              --arg author "$AUTHOR" \
              --arg repo "$REPO" \
              --arg status "$STATUS" \
              --arg url "$URL" \
              --arg branch "$BRANCH" \
              --arg base_branch "$BASE_BRANCH" \
              --arg head_sha "$HEAD_SHA" \
              --arg body "$BODY" \
              --arg created_at "$CREATED_AT" \
              --arg updated_at "$UPDATED_AT" \
              --arg closed_at "$CLOSED_AT" \
              --arg merged_at "$MERGED_AT_FMT" \
              --arg merged_by "$MERGED_BY" \
              --argjson commits "${COMMITS:-0}" \
              --argjson additions "${ADDITIONS:-0}" \
              --argjson deletions "${DELETIONS:-0}" \
              --argjson changed_files "${CHANGED_FILES:-0}" \
              --arg labels "$LABELS" \
              --arg milestone "$MILESTONE" \
              --arg assignees "$ASSIGNEES" \
              --arg reviewers "$REVIEWERS" \
              '{
                "PR标题": $title,
                "PR编号": $number,
                "作者": $author,
                "仓库": $repo,
                "状态": $status,
                "链接": $url,
                "分支名称": $branch,
                "目标分支": $base_branch,
                "Head SHA": $head_sha,
                "PR描述": $body,
                "创建时间": $created_at,
                "更新时间": $updated_at,
                "提交数": $commits,
                "新增行数": $additions,
                "删除行数": $deletions,
                "变更文件数": $changed_files,
                "标签": $labels,
                "里程碑": $milestone,
                "指派人": $assignees,
                "审查人": $reviewers,
                "合并人": $merged_by
              }
              | if $closed_at != "" then . + {"关闭时间": $closed_at} else . end
              | if $merged_at != "" then . + {"合并时间": $merged_at} else . end')

            # Find existing record
            SEARCH_RESULT=$(lark-cli base +record-search \
              --base-token "$BITABLE_APP_TOKEN" \
              --table-id "$BITABLE_TABLE_ID" \
              --as bot \
              --format json \
              --json "{\"keyword\":\"$PR_NUMBER\",\"search_fields\":[\"PR编号\"],\"select_fields\":[\"PR编号\"],\"limit\":50}")

            RECORD_ID=$(echo "$SEARCH_RESULT" | jq -r --argjson num "$PR_NUMBER" '
              .data as $d |
              if ($d.fields | length) == 0 then empty
              else
                ($d.fields | to_entries | map(select(.value == "PR编号")) | .[0].key) as $idx |
                if $idx == null then empty
                else
                  [ $d.data | to_entries[] | select(.value[$idx] == $num) | .key ] | .[0] as $row |
                  if $row == null then empty
                  else $d.record_id_list[$row]
                  end
                end
              end // empty')

            # Upsert
            ARGS=(
              --base-token "$BITABLE_APP_TOKEN"
              --table-id "$BITABLE_TABLE_ID"
              --as bot
              --json "$FIELDS"
            )
            if [ -n "$RECORD_ID" ]; then
              echo "  Updating existing record: $RECORD_ID"
              ARGS+=(--record-id "$RECORD_ID")
            else
              echo "  Creating new record"
            fi
            lark-cli base +record-upsert "${ARGS[@]}" > /dev/null

            # Rate limit: sleep between writes to avoid conflicts
            sleep 1
          done

          echo "=== Sync complete ==="
