[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kerker"
version = "0.2.0"
description = "KerKer - 面向计算加速的多智能体 Agent 框架"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "王祥祺"},
]
keywords = ["agent", "llm", "deepseek", "ascend", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
]

[project.scripts]
kerker = "main:main"

[project.urls]
Homepage = "https://github.com/wxiangqi1202-cpu/kerker-computer-assistant"

[tool.setuptools.packages.find]
include = ["core*", "cli*", "display*", "skills*", "agents*"]
